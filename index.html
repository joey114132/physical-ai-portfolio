<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <title id="page-title"></title>
    <meta name="description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" id="meta-og-title" />
    <meta property="og:description" content="" id="meta-og-desc" />
    <meta property="og:url" content="" id="meta-og-url" />
    <meta property="og:image" content="" id="meta-og-image" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="" id="meta-tw-title" />
    <meta name="twitter:description" content="" id="meta-tw-desc" />
    <meta name="twitter:image" content="" id="meta-tw-image" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;700&family=Unbounded:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.1/src/URDFLoader.js"
        }
      }
    </script>
  </head>
  <body class="intro easy-read boot-loading">
    <div
      id="boot-loader"
      class="boot-loader"
      role="progressbar"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-labelledby="boot-loader-status"
    >
      <div class="boot-loader__panel">
        <p class="boot-loader__eyebrow">◈ Physical AI Lab</p>
        <div class="boot-loader__track">
          <div class="boot-loader__bar" id="boot-loader-bar"></div>
        </div>
        <p class="boot-loader__status" id="boot-loader-status"></p>
      </div>
    </div>

    <div class="viewport-edge-fx" aria-hidden="true">
      <span class="viewport-edge-fx__edge viewport-edge-fx__edge--top"></span>
      <span class="viewport-edge-fx__edge viewport-edge-fx__edge--right"></span>
      <span class="viewport-edge-fx__edge viewport-edge-fx__edge--bottom"></span>
      <span class="viewport-edge-fx__edge viewport-edge-fx__edge--left"></span>
    </div>

    <div class="ambient" aria-hidden="true">
      <div class="ambient__mesh"></div>
      <div class="ambient__grid"></div>
      <div class="ambient__vignette"></div>
    </div>

    <div id="canvas-root" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div id="cursor-glow" class="cursor-glow" aria-hidden="true"></div>

    <section id="intro-overlay" class="overlay intro-overlay" aria-modal="true">
      <div class="overlay__card intro-card">
        <div class="intro-card__frame" aria-hidden="true"></div>
        <div class="intro-card__scroll">
          <div class="intro-lang" role="group" aria-labelledby="intro-lang-label">
          <p class="intro-lang__label" id="intro-lang-label"></p>
          <div class="intro-lang__options">
            <button type="button" class="intro-lang__btn" data-lang="en" id="intro-lang-en">
              English
            </button>
            <button type="button" class="intro-lang__btn" data-lang="ko" id="intro-lang-ko">
              한국어
            </button>
          </div>
          </div>
          <p class="intro-card__eyebrow" id="intro-eyebrow"></p>
          <h1 class="intro-card__title" id="intro-title"></h1>
          <p class="intro-card__alias" id="intro-alias"></p>
          <p class="intro-card__role" id="intro-role"></p>
          <p class="intro-card__lead" id="intro-lead"></p>
          <div class="intro-card__stations" id="intro-stations" hidden></div>
          <p class="intro-card__return hidden" id="intro-return"></p>
          <p class="intro-card__edu" id="intro-edu"></p>
          <div class="intro-card__controls" id="intro-controls" aria-label="How to play"></div>
          <div class="intro-card__actions">
            <button type="button" id="intro-start" class="btn btn--primary btn--intro-cta"></button>
            <button type="button" id="intro-skip" class="btn btn--ghost"></button>
          </div>
        </div>
      </div>
    </section>

    <section id="journey-overlay" class="overlay journey-overlay hidden" aria-modal="true" hidden>
      <div class="journey-card overlay__card">
        <div class="journey-card__fx" aria-hidden="true">
          <div class="journey-card__glow"></div>
          <div class="journey-card__scan"></div>
        </div>
        <div class="journey-card__scroll" id="journey-scroll" tabindex="-1">
          <header class="journey-exit__masthead">
            <p class="journey-card__eyebrow" id="journey-eyebrow"></p>
            <p
              class="journey-card__scroll-hint hidden"
              id="journey-scroll-hint"
              aria-hidden="true"
            ></p>
          </header>

          <section
            class="journey-exit__block journey-section journey-section--about"
            id="journey-about-section"
            aria-labelledby="journey-about-title"
          >
            <h2 class="journey-exit__block-title" id="journey-about-title"></h2>
            <div class="journey-about">
              <div class="journey-about__header about-card__header">
                <img
                  id="about-photo"
                  class="about-card__photo"
                  src="assets/about/profile.jpg"
                  alt=""
                  width="128"
                  height="158"
                  loading="lazy"
                  decoding="async"
                />
                <div class="about-card__identity">
                  <h3 class="about-card__title" id="about-title"></h3>
                  <p class="about-card__role" id="about-role"></p>
                </div>
              </div>
              <p class="about-card__bio" id="about-bio"></p>
              <ul id="about-strengths" class="about-card__list"></ul>
              <h4 id="about-gallery-title" class="about-card__gallery-title hidden"></h4>
              <div id="about-gallery" class="about-gallery hidden" role="list"></div>
              <p class="about-card__contact">
                <a id="about-phone" href="#"></a>
              </p>
              <p class="about-card__thanks" id="about-thanks"></p>
              <div id="about-diploma-block" class="about-card__art hidden">
                <p id="about-diploma-intro" class="about-card__art-intro"></p>
                <a
                  id="about-diploma-link"
                  class="about-card__link"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                ></a>
              </div>
              <div id="about-art-block" class="about-card__art hidden">
                <p id="about-art-intro" class="about-card__art-intro"></p>
                <a
                  id="about-art-link"
                  class="about-card__link"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                ></a>
              </div>
            </div>
          </section>

          <section
            class="journey-exit__block journey-section journey-section--log"
            id="journey-log-section"
            aria-labelledby="journey-title"
          >
            <h2 class="journey-exit__block-title" id="journey-title"></h2>
            <p class="journey-card__subtitle" id="journey-subtitle"></p>
            <p class="journey-card__bootcamp hidden" id="journey-bootcamp"></p>
            <blockquote class="journey-card__manifesto" id="journey-manifesto"></blockquote>

            <section class="journey-section journey-section--timeline">
              <h3 class="journey-section__title" id="journey-milestones-title"></h3>
              <ol class="journey-timeline" id="journey-milestones"></ol>
            </section>

            <section class="journey-section journey-section--learned">
              <h3 class="journey-section__title" id="journey-learned-title"></h3>
              <ul class="journey-chips" id="journey-learned"></ul>
            </section>

            <div class="journey-horizon">
              <section class="journey-horizon__col journey-horizon__col--present">
                <h3 class="journey-horizon__title" id="journey-present-title"></h3>
                <ul class="journey-horizon__list" id="journey-present"></ul>
              </section>
              <section class="journey-horizon__col journey-horizon__col--future">
                <h3 class="journey-horizon__title" id="journey-future-title"></h3>
                <ul class="journey-horizon__list" id="journey-future"></ul>
              </section>
            </div>

            <section
              class="journey-section journey-section--sources hidden"
              id="journey-sources-section"
            >
              <h3 class="journey-section__title" id="journey-sources-title"></h3>
              <ul class="journey-sources" id="journey-sources"></ul>
            </section>
          </section>
        </div>

        <footer class="journey-card__actions">
          <button type="button" id="journey-close" class="btn btn--primary"></button>
        </footer>
      </div>
    </section>

    <div id="orbit-ui" class="ui">
      <header class="top-bar">
        <div class="top-bar__row">
          <div class="brand">
            <span class="brand__mark">◈</span>
            <span class="brand__text" id="brand-text" data-tier="short">
              <span class="brand__label brand__label--full" id="brand-label-full"></span>
              <span
                class="brand__label brand__label--short"
                id="brand-label-short"
                aria-hidden="true"
              ></span>
              <span
                class="brand__label brand__label--micro"
                id="brand-label-micro"
                aria-hidden="true"
              ></span>
            </span>
          </div>
          <div class="top-bar__status" id="top-status" aria-live="polite">
            <span class="top-bar__status-num" id="top-station-num">01</span>
            <span class="top-bar__status-phase" id="top-station-phase">DL</span>
            <span class="top-bar__status-progress" id="top-quest-progress"></span>
          </div>
          <div class="top-bar__tools">
            <button
              type="button"
              id="sound-btn"
              class="icon-btn"
              aria-label="Toggle sound"
              aria-pressed="false"
            >
              <span class="icon-btn__glyph" id="sound-glyph">♪</span>
            </button>
            <button type="button" id="lang-btn" class="lang-btn" aria-label="Switch language">
              <span class="lang-btn__dot"></span>
              <span class="lang-btn__label">English</span>
            </button>
            <button
              type="button"
              id="ui-menu-btn"
              class="icon-btn ui-menu-btn"
              aria-expanded="false"
              aria-controls="ui-drawer-panel"
              aria-label="Open menu"
            >
              <span class="ui-menu-btn__icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <p id="quest-banner" class="quest-banner" role="status"></p>
      </header>

      <section class="hero">
        <div class="hero__panel">
          <p class="hero__eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-name"></h1>
          <span class="hero__alias" id="hero-sub"></span>
          <p class="hero__role" id="hero-role"></p>
          <p class="hero__tagline" id="hero-tagline"></p>
          <p class="hero__lab-notes" id="hero-lab-notes" aria-live="polite"></p>
          <div class="hero__rule" aria-hidden="true"></div>
        </div>
      </section>

      <aside class="hud" aria-hidden="true">
        <div class="hud__block">
          <span class="hud__label" id="hud-label">MAZE</span>
          <span class="hud__value" id="hud-index">01</span>
        </div>
        <div class="hud__block">
          <span class="hud__label">PHASE</span>
          <span class="hud__value hud__value--sm" id="hud-phase">DL</span>
        </div>
        <div class="hud__rail">
          <div class="hud__rail-fill" id="hud-rail"></div>
        </div>
      </aside>

      <aside class="minimap" aria-label="Maze map">
        <canvas id="minimap-canvas" width="120" height="88"></canvas>
        <p id="quest-progress" class="minimap__progress"></p>
      </aside>

      <aside id="ui-drawer" class="ui-drawer" aria-hidden="true">
        <div id="ui-drawer-backdrop" class="ui-drawer__backdrop" tabindex="-1" hidden></div>
        <div
          id="ui-drawer-panel"
          class="ui-drawer__panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="ui-drawer-title"
        >
          <header class="ui-drawer__head">
            <h2 id="ui-drawer-title" class="ui-drawer__title">Projects</h2>
            <button
              type="button"
              id="ui-drawer-close"
              class="icon-btn ui-drawer__close"
              aria-label="Close menu"
            >
              ✕
            </button>
          </header>
          <div id="ui-drawer-meta" class="ui-drawer__meta" aria-live="polite"></div>
          <nav id="timeline" class="timeline" aria-label="Project timeline"></nav>
          <footer class="dock">
            <a
              id="footer-github"
              class="dock__link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            ></a>
            <p id="nav-hint" class="dock__hint" hidden></p>
          </footer>
        </div>
      </aside>
    </div>

    <section id="detail-view" class="detail" aria-hidden="true">
      <div class="detail__accent" aria-hidden="true"></div>
      <span class="detail__watermark" id="detail-watermark" aria-hidden="true">01</span>

      <header class="detail-top">
        <button type="button" id="detail-back" class="detail-back">
          <span class="detail-back__arrow">←</span>
          <span id="detail-back-label">궤도</span>
        </button>
        <button
          type="button"
          id="detail-3d-toggle"
          class="detail-3d-toggle"
          aria-expanded="true"
          hidden
        >
          3D
        </button>
        <div class="detail-meta">
          <span id="detail-phase" class="detail-phase"></span>
          <h1 id="detail-title"></h1>
          <p id="detail-subtitle" class="detail-subtitle"></p>
        </div>
      </header>

      <div class="detail-body">
        <div class="detail-visual">
          <div class="detail-visual__frame">
            <canvas id="detail-canvas"></canvas>
          </div>
          <p class="detail-visual__caption" id="detail-visual-caption">3D artifact · interactive</p>
        </div>
        <div class="detail-content-wrap">
          <div id="detail-scroll-progress" class="detail-scroll-progress" aria-hidden="true"></div>
          <p id="detail-scroll-hint" class="detail-scroll-hint" aria-hidden="true"></p>
          <div id="detail-content" class="detail-content" tabindex="-1">
            <p id="detail-team" class="detail-team"></p>
            <p id="detail-meta-line" class="detail-meta-line"></p>
            <div id="detail-highlights" class="detail-highlights" hidden></div>
            <p id="detail-summary" class="detail-summary"></p>

            <section class="detail-section">
              <h2 id="detail-role-title"></h2>
              <ul id="detail-role" class="detail-bullets detail-bullets--role"></ul>
            </section>

            <section class="detail-section">
              <h2 id="detail-contrib-title"></h2>
              <ul id="detail-contributions" class="detail-list"></ul>
            </section>

            <section class="detail-section">
              <h2 id="detail-skills-title"></h2>
              <div id="detail-skills" class="skill-grid"></div>
            </section>

            <section class="detail-section">
              <h2 id="detail-tech-title"></h2>
              <ul id="detail-techniques" class="detail-list detail-list--dense"></ul>
            </section>

            <section class="detail-section">
              <h2 id="detail-obstacles-title"></h2>
              <div id="detail-obstacles" class="obstacle-grid"></div>
            </section>

            <section class="detail-section">
              <h2 id="detail-outcomes-title"></h2>
              <ul id="detail-outcomes" class="detail-list"></ul>
            </section>

            <section class="detail-section">
              <h2 id="detail-aids-title"></h2>
              <div id="detail-aids" class="visual-aids"></div>
            </section>

            <section class="detail-section">
              <h2 id="detail-stack-title"></h2>
              <div id="detail-tags" class="tags"></div>
            </section>

            <section id="detail-links-section" class="detail-section detail-section--links">
              <h2 id="detail-links-title"></h2>
              <div class="detail-links">
                <a
                  id="detail-deck"
                  class="panel-repo panel-repo--deck"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                  hidden
                ></a>
                <a
                  id="detail-repo"
                  class="panel-repo"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                ></a>
              </div>
            </section>

            <section class="detail-section detail-section--gallery">
              <h2 id="detail-gallery-title"></h2>
              <div id="detail-gallery" class="gallery"></div>
            </section>
          </div>
        </div>
      </div>
    </section>

    <div id="cutscene" class="cutscene" hidden aria-hidden="true">
      <div class="cutscene__bar" aria-hidden="true"></div>
      <div class="cutscene__content">
        <p class="cutscene__phase" id="cutscene-phase"></p>
        <h2 class="cutscene__title" id="cutscene-title"></h2>
        <div class="cutscene__rule" aria-hidden="true"></div>
      </div>
    </div>

    <div id="mobile-controls" class="mobile-controls" hidden>
      <div id="mobile-joystick" class="mobile-joystick" role="group" aria-label="Move">
        <div class="mobile-joystick__base">
          <div id="mobile-joystick-thumb" class="mobile-joystick__thumb" aria-hidden="true"></div>
        </div>
      </div>
      <div class="mobile-actions">
        <button
          type="button"
          id="mobile-sprint"
          class="mobile-btn mobile-btn--sprint hidden"
          hidden
          aria-pressed="false"
          aria-label="Sprint"
          tabindex="-1"
        >
          <svg class="mobile-sprint-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle class="mobile-sprint-icon__head" cx="14.2" cy="5.1" r="1.85" />
            <path
              class="mobile-sprint-icon__runner"
              d="M12.6 7.5 L9.8 11.8 l-2.7 1.1 0.9 2.1 3.1-0.8 1.9 5.1 h2.2 l-1.1-5.7 2.4-1-0.7-1.8-2.7 0.1 1.6-2.9 2.3-2.2-1.6-1.4 1.2 0 Z"
            />
            <path class="mobile-sprint-icon__motion" d="M3.4 17.2h2.6M2.3 14h2.1M4.5 19.8h2.2" />
          </svg>
        </button>
        <button
          type="button"
          id="mobile-interact"
          class="mobile-btn mobile-btn--interact"
          aria-label="Open"
        >
          E
        </button>
      </div>
    </div>

    <div id="lightbox" class="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Close">
        ✕
      </button>
      <div class="lightbox__stage" id="lightbox-stage"></div>
      <p class="lightbox__caption" id="lightbox-caption"></p>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
